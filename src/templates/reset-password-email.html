<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
</head>
<body>
  <div style="max-width: 480px; margin: 0 auto; font-family: Arial, sans-serif;">
    <h2>Password Reset Request</h2>
    <p>Hello, {{username}}!</p>
    <p>We received a request to reset your password. Click the link below to set a new password:</p>
    <p>
      <a href="{{resetLink}}" style="display: inline-block; padding: 10px 20px; background-color: #4f46e5; color: #ffffff; text-decoration: none; border-radius: 6px;">
        Reset Password
      </a>
    </p>
    <p>This link will expire in 15 minutes.</p>
    <p>If you did not request this, please ignore this email.</p>
  </div>
</body>
</html>
